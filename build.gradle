plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.16.1'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
loom {
    splitEnvironmentSourceSets()
    mods {
        howlingwerewolf {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    accessWidenerPath = file('src/main/resources/howlingwerewolf.accesswidener')
    runs { server { programArg '--nogui' } }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '500']
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from('examples/custom-skin-pack') { into 'howlingwerewolf_skin_template' }
}
tasks.named('jar', Jar) {
    from(project.files('LICENSE.md', 'LICENSE-CODE.md', 'LICENSE-ASSETS.md', 'ASSET_PROVENANCE.md', 'CREDITS.txt')) {
        into 'META-INF'
    }
}
def releaseVersion = project.mod_version.toString().split('-')[0]
tasks.named('remapJar') { archiveFileName = "${project.archives_base_name}-${releaseVersion}-fabric-${project.minecraft_version}.jar" }
