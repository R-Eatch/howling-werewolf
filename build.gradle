plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
loom {
    splitEnvironmentSourceSets()
    mods {
        howlingwerewolf {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    accessWidenerPath = file('src/main/resources/howlingwerewolf.accesswidener')
    runs { server { programArg '--nogui' } }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '500']
}
processResources {
    def metadata = [
        version: project.version,
        minecraft: project.minecraft_version,
        loader: project.loader_version,
        fabric_api: project.fabric_version,
    ]
    inputs.properties metadata
    filesMatching('fabric.mod.json') { expand metadata }
    from('examples/custom-skin-pack') { into 'howlingwerewolf_skin_template' }
}
tasks.named('jar', Jar) {
    from(project.files('LICENSE.md', 'LICENSE-CODE.md', 'LICENSE-ASSETS.md', 'docs/ASSET_PROVENANCE.md', 'CREDITS.txt')) {
        into 'META-INF'
    }
}
def releaseVersion = project.mod_version.toString().split('-')[0]
tasks.named('jar') { archiveFileName = "${project.archives_base_name}-${releaseVersion}-fabric-${project.minecraft_version}.jar" }
